name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust · lint & build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt --check
        working-directory: src-tauri
        # The codebase doesn't follow rustfmt's default style yet; this reports drift
        # without blocking the build. Flip to a hard failure once the project adopts it.
        run: cargo fmt --check || echo "::warning::Code isn't rustfmt-formatted (non-blocking for now)."

      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo build
        working-directory: src-tauri
        run: cargo build --locked

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

  frontend:
    name: Frontend · syntax check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JS syntax
        run: |
          status=0
          for f in $(find ui docs -name '*.js' -not -path '*/node_modules/*'); do
            node --check "$f" || status=1
          done
          exit $status
      - name: npm install (sanity check lockfile/deps)
        run: npm ci || npm install
