[package]
name = "purgo"
version = "1.0.0"
description = "Purgo — nettoyage, optimisation et outils développeurs pour Windows, Linux et macOS"
authors = ["Tototra"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "purgo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
dirs = "7.0.0"
plist = "1.7.4"
rayon = "1.10.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sysinfo = "0.36.1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
trash = "5.2.3"
walkdir = "2.5.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
